# Cloudflare Worker that serves genbeya.fyi as static assets, with no code of its own.
# `npm run build` writes dist/, including the security headers in dist/_headers;
# CI deploys it with `wrangler deploy`, which also creates the Worker on its first run.
name = "genbeya-website"
compatibility_date = "2026-10-01"
# genbeya.fyi is the only address: no workers.dev copy, which sits outside the zone's settings
# (Network Error Logging is off for genbeya.fyi only), and no preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
